controller_manager:
  ros__parameters:
    update_rate: 100
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    left_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    right_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

left_arm_controller:
  ros__parameters:
    joints:
      - left_shoulder_yaw
      - left_shoulder_roll
      - left_elbow_x_link_joint
      - left_wrist
      - left_thumb
      - left_index
      - left_middle
      - left_ring
      - left_pinky
    command_interfaces:
      - position
    state_interfaces:
      - position

right_arm_controller:
  ros__parameters:
    joints:
      - right_shoulder_yaw
      - right_shoulder_roll
      - right_elbow_x_link_joint
      - rright_wrist_z_link_jointt
      - right_thumb
      - right_index
      - right_middle
      - right_ring
      - right_pinky
    command_interfaces:
      - position
    state_interfaces:
      - position